<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cbt test</title>
     <style>
        body {
            background-color: rgb(248, 247, 253);
            color: rgb(7, 4, 82);
            font-family: Arial, sans-serif;
            
        }
    </style>
</head>
<body>
    <div style="background-color: rgb(203, 203, 215); padding: 30px;"  >
    <h1 style="text-align: center;">REX CHRISTUS COLLEGE ADMISSION FORM</h1>
    </div>
    <br><br>
    <div style="background-color: rgb(203, 203, 215); padding: 5px; width: 100%;">
        <h3 style="text-align: left;"> STUDENTS INFORMATION</h3></div>
        <br>
    <form>
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" placeholder="Enter your name" 
        style="width: 80%; box-sizing: border-box; padding: 10px; margin: 8px;">
        <br><br>
        
        <label for="date">Date of Birth:</label><br>
        <input type="date" id="date" placeholder="enter your date of Birth"
        style="width: 80%; padding: 10px; box-sizing: border-box; margin: 8px;">
        <br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" placeholder="Enter Email"
        style="margin: 8px; padding: 10px; width: 80%; box-sizing: border-box;">
        <br><br>

        <label for="gender">Gender:</label><br>
        <select id="gender" name="Gender"
        style="padding: 10px; border-radius: 5px; width: 80%; margin: 8px;"><br>
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select> <br><br>
        
        <label for="submit"></label>
    <br> <input type="submit" id="submit"
    style="padding: 10px; margin: 8px; width: 80%; box-sizing: border-box;">



       


    </form> 

</body>





</html>
